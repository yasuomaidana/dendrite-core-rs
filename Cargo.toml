[package]
name = "dendrite-core-rs"
version = "0.1.0"
edition = "2021"
description = "Syntax-aware source analysis for Dendrite: complexity, folding, hashing, token counts"
license = "MIT"

[lib]
name = "dendrite_core"
path = "src/lib.rs"

[[bin]]
name = "dendrite-core"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
blake3 = "1.8.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-svelte-ng = "1"
tree-sitter-typescript = "0.23"

[dev-dependencies]
rstest = "0.28.0"

[profile.release]
lto = "thin"
codegen-units = 1
